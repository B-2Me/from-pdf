name: Issue PDF Converter

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: pdf-converter
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-models-${{ runner.os }}

      - name: Cache Llama.cpp
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: ~/llama_bin
          key: llama-b10809-ubuntu-x64

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip poppler-utils
          
          pip install uv
          uv pip install --system . openai
          
          if [ "${{ steps.cache-llama.outputs.cache-hit }}" != "true" ]; then
            wget "https://github.com/ggml-org/llama.cpp/releases/download/b10809/llama-b10809-bin-ubuntu-x64.tar.gz" -O llama.tar.gz
            mkdir -p ~/llama_bin
            tar -xzf llama.tar.gz -C ~/llama_bin --strip-components=1
            chmod +x ~/llama_bin/llama-server
          fi
          
          echo "$HOME/llama_bin" >> $GITHUB_PATH
          echo "GGML_BACKEND_PATH=$HOME/llama_bin" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/llama_bin:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Extract PDF URL and Download
        run: |
          PDF_URL=$(echo "${{ github.event.issue.body }}" | grep -oP 'https://github\.com/user-attachments/(files|assets)/[^)]+\.pdf' | head -n 1)
          if [ -z "$PDF_URL" ]; then exit 1; fi
          curl -L -o document.pdf "$PDF_URL"

      - name: Parse Slash Commands
        run: |
          # 1. Engine Routing
          ENGINE="marker"
          if echo "${{ github.event.issue.body }}" | grep -iq "/engine=vision"; then ENGINE="vision"; fi
          if echo "${{ github.event.issue.body }}" | grep -iq "/engine=marker-llm"; then ENGINE="marker-llm"; fi
          echo "ENGINE=$ENGINE" >> $GITHUB_ENV
          echo "-> Engine: $ENGINE"

          # 2. OCR Mode Override
          if echo "${{ github.event.issue.body }}" | grep -iq "/force-ocr"; then
            echo "OCR_ARG=--force_ocr" >> $GITHUB_ENV
            echo "-> OCR: Forced (Neural Vision OCR)"
          else
            echo "OCR_ARG=" >> $GITHUB_ENV
            echo "-> OCR: Standard (Fast Native Layer)"
          fi

          # 3. Footer Handling Mode (/footers=remove | /footers=simplified | /footers=keep)
          FOOTER_MODE="remove"
          if echo "${{ github.event.issue.body }}" | grep -iq "/footers=keep"; then FOOTER_MODE="keep"; fi
          if echo "${{ github.event.issue.body }}" | grep -iq "/footers=simplified"; then FOOTER_MODE="simplified"; fi
          echo "FOOTER_MODE=$FOOTER_MODE" >> $GITHUB_ENV
          echo "-> Footers: $FOOTER_MODE"

          # 4. Page Range & File Suffix
          PAGE_RANGE=$(echo "${{ github.event.issue.body }}" | grep -oP '/page-range(?:=|\s+)\K[\d-]+' | head -n 1)
          if [ -n "$PAGE_RANGE" ]; then
            FIRST_PAGE=$(echo "$PAGE_RANGE" | cut -d'-' -f1)
            LAST_PAGE=$(echo "$PAGE_RANGE" | cut -d'-' -f2)
            
            MARKER_FIRST=$((FIRST_PAGE - 1))
            MARKER_LAST=$((LAST_PAGE - 1))
            
            echo "PAGE_ARG=--page_range $MARKER_FIRST-$MARKER_LAST" >> $GITHUB_ENV
            echo "FILE_SUFFIX=pages_$PAGE_RANGE" >> $GITHUB_ENV
            echo "PDFTOPPM_ARGS=-f $FIRST_PAGE -l $LAST_PAGE" >> $GITHUB_ENV
            echo "START_PAGE_NUM=$FIRST_PAGE" >> $GITHUB_ENV
            echo "-> Page Range: $PAGE_RANGE (Translated to $MARKER_FIRST-$MARKER_LAST for Marker)"
          else
            echo "PAGE_ARG=" >> $GITHUB_ENV
            echo "FILE_SUFFIX=full_document" >> $GITHUB_ENV
            echo "PDFTOPPM_ARGS=" >> $GITHUB_ENV
            echo "START_PAGE_NUM=1" >> $GITHUB_ENV
          fi

          # 5. Timeout Override
          TIMEOUT_MINS=$(echo "${{ github.event.issue.body }}" | grep -oP '/timeout(?:=|\s+)\K\d+' | head -n 1)
          if [ -z "$TIMEOUT_MINS" ]; then TIMEOUT_MINS="120"; fi
          echo "TIMEOUT_MINUTES=$TIMEOUT_MINS" >> $GITHUB_ENV
          echo "-> Timeout: ${TIMEOUT_MINS}m"

          # 6. Model Override
          CUSTOM_MODEL=$(echo "${{ github.event.issue.body }}" | grep -oP '/model(?:=|\s+)\K[^\s]+' | head -n 1)
          echo "CUSTOM_MODEL=$CUSTOM_MODEL" >> $GITHUB_ENV
          if [ -n "$CUSTOM_MODEL" ]; then echo "-> Model Override: $CUSTOM_MODEL"; fi

      # ==========================================
      # ENGINE 1: PURE VISION
      # ==========================================
      - name: Engine | Vision Pipeline
        if: env.ENGINE == 'vision'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p conversions/issue-${{ github.event.issue.number }}/vision
          pdftoppm -png -r 150 $PDFTOPPM_ARGS document.pdf conversions/issue-${{ github.event.issue.number }}/vision/page || echo "⚠️ pdftoppm image extraction completed with warnings."
          mv page-*.png conversions/issue-${{ github.event.issue.number }}/vision/ 2>/dev/null || true
          
          cat << 'EOF' > run_vision.py
          import base64
          import os
          import sys
          import glob
          import re
          import time
          from collections import Counter
          from openai import OpenAI

          client = OpenAI(
              base_url="https://openrouter.ai/api/v1",
              api_key=os.environ.get("OPENROUTER_API_KEY"),
          )

          model_to_use = os.environ.get("CUSTOM_MODEL") or "google/gemma-4-31b-it:free"
          file_suffix = os.environ.get("FILE_SUFFIX")
          footer_mode = os.environ.get("FOOTER_MODE") or "remove"
          start_page_num = int(os.environ.get("START_PAGE_NUM") or 1)

          def get_page_num(filename):
              m = re.search(r'page.*?(\d+)\.png$', filename)
              return int(m.group(1)) if m else 0

          def clean_invisible(s):
              return re.sub(r'[\u200b\u200c\u200d\uFEFF]', '', s)

          def is_horizontal_rule(line):
              s = clean_invisible(line).strip()
              return bool(re.match(r'^(?:(?:\s*-\s*){3,}|(?:\s*\*\s*){3,}|(?:\s*_\s*){3,})$', s))

          def is_bare_page_number(line):
              s = clean_invisible(line).strip()
              if not s:
                  return False
              if re.match(r'^<center>\s*\d+\s*</center>$', s, re.IGNORECASE):
                  return True
              if re.match(r'^(?:page\s*)?-?\s*\d+\s*(?:/|of|-)?\s*\d*\s*-?$', s, re.IGNORECASE):
                  return True
              if re.match(r'^(?:[ivxlcdm]+)$', s, re.IGNORECASE):
                  return True
              return False

          def is_page_number_or_separator(line):
              s = clean_invisible(line).strip()
              if not s:
                  return True
              return is_horizontal_rule(line) or is_bare_page_number(line)

          def normalize_for_comparison(line):
              s = clean_invisible(line)
              return re.sub(r'[\W\d_]+', '', s.lower())

          def prune_simplified_page_breaks(text):
              p1 = r'(?m)^(?:\s*-\s*){3,}\s*\n+\s*\d+\s*\n+(?:\s*-\s*){3,}\s*$'
              text = re.sub(p1, '', text)
              p2 = r'(?m)^\s*\d+\s*\n+(?:\s*-\s*){3,}\s*\n+\s*\d+\s*$'
              text = re.sub(p2, '', text)
              p3 = r'(?m)^(?:\s*-\s*){3,}\s*\n+\s*\d+\s*$'
              text = re.sub(p3, '', text)
              p4 = r'(?m)^\s*\d+\s*\n+(?:\s*-\s*){3,}\s*$'
              text = re.sub(p4, '', text)
              return text

          image_files = sorted(glob.glob(f"{sys.argv[1]}/vision/page-*.png"), key=get_page_num)
          out_file = f"{sys.argv[1]}/document_vision_{file_suffix}.md"

          print(f"-> Found {len(image_files)} pages. Processing with {model_to_use}...", flush=True)

          raw_pages = []
          prompt = """Transcribe this document page into clean Markdown. 

CRITICAL MATH RULES:
1. ALWAYS format mathematical equations, symbols, and standalone variables using proper LaTeX enclosed in `$` for inline math and `$$` for block math.
2. NEVER use Unicode math characters (e.g., avoid 𝓕, ℒ, Σ). Use their LaTeX equivalents instead (e.g., $\mathcal{F}$, $\mathcal{L}$, $\Sigma$).
3. DO NOT escape underscores. Write `_` instead of `\_` both inside and outside of math blocks.

EXCLUSION RULES:
- DO NOT include repetitive running headers or running footers from the margins.
- DO NOT include page numbers.

FORMATTING RULES:
- Reconstruct schedules and tables using standard |---| Markdown tables with <br> for inner line breaks. 
- Do NOT use HTML tags (no <ul>, <li>, <p>). 
- Ensure main headers, body text, equations, and footnotes are fully captured."""

          for img_path in image_files:
              print(f"   Transcribing {os.path.basename(img_path)}...", flush=True)
              with open(img_path, "rb") as f:
                  b64_image = base64.b64encode(f.read()).decode("utf-8")

              attempt = 1
              page_content = ""
              while attempt <= 3:
                  try:
                      response = client.chat.completions.create(
                          model=model_to_use,
                          messages=[
                              {
                                  "role": "user",
                                  "content": [
                                      {"type": "text", "text": prompt},
                                      {"type": "image_url", "image_url": {"url": f"data:image/png;base64,{b64_image}"}}
                                  ]
                              }
                          ]
                      )
                      content = response.choices[0].message.content
                      if content is None:
                          raise ValueError("API returned an empty response (NoneType)")
                      page_content = content
                      break
                  except Exception as e:
                      print(f"     ❌ Attempt {attempt} failed: {e}", flush=True)
                      time.sleep(5 * attempt)
                      attempt += 1

              raw_pages.append(page_content)
              time.sleep(2)

          cleaned_pages = []

          if footer_mode == "keep":
              cleaned_pages = raw_pages
          else:
              margin_signatures = Counter()
              for content in raw_pages:
                  lines = [ln.strip() for ln in content.splitlines() if ln.strip()]
                  top_candidates = lines[:3]
                  bottom_candidates = lines[-3:] if len(lines) > 3 else []
                  
                  seen_in_page = set()
                  for candidate in top_candidates + bottom_candidates:
                      norm = normalize_for_comparison(candidate)
                      if len(norm) >= 12:
                          seen_in_page.add(norm)
                  margin_signatures.update(seen_in_page)

              threshold = max(2, int(len(raw_pages) * 0.35))
              recurrent_margin_patterns = {sig for sig, count in margin_signatures.items() if count >= threshold}

              for page_idx, content in enumerate(raw_pages):
                  normalized_content = prune_simplified_page_breaks(content)
                  lines = normalized_content.splitlines()
                  non_empty_indices = [i for i, line in enumerate(lines) if line.strip()]
                  
                  if not non_empty_indices:
                      continue
                      
                  header_bound_idx = non_empty_indices[min(2, len(non_empty_indices) - 1)]
                  footer_bound_idx = non_empty_indices[max(0, len(non_empty_indices) - 3)]
                  
                  filtered_lines = []
                  for idx, line in enumerate(lines):
                      if is_page_number_or_separator(line):
                          continue
                          
                      if idx <= header_bound_idx or idx >= footer_bound_idx:
                          norm = normalize_for_comparison(line)
                          if norm in recurrent_margin_patterns:
                              continue
                              
                      filtered_lines.append(line)

                  page_body = "\n".join(filtered_lines).strip()
                  
                  if footer_mode == "simplified":
                      current_num = start_page_num + page_idx
                      page_body = f"{page_body}\n\n---\n{current_num}"
                      
                  cleaned_pages.append(page_body)

          with open(out_file, "w", encoding="utf-8") as f:
              full_doc = "\n\n".join(p.strip() for p in cleaned_pages if p.strip())
              full_doc = re.sub(r'\n\n\n+', '\n\n', full_doc)
              f.write(full_doc)

          print(f"✅ Transcription complete (footer mode: {footer_mode}). Written to {out_file}", flush=True)
          EOF
          
          timeout ${TIMEOUT_MINUTES}m python run_vision.py conversions/issue-${{ github.event.issue.number }} || echo "⚠️ Vision script timed out, partial file saved."

      # ==========================================
      # ENGINE 2: MARKER CPU (DEFAULT FAST)
      # ==========================================
      - name: Engine | Marker Base
        if: env.ENGINE == 'marker'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          timeout ${TIMEOUT_MINUTES}m marker_single document.pdf --output_dir conversions/issue-${{ github.event.issue.number }}/marker_base \
            --mode fast $OCR_ARG --debug --keep_pagefooter_in_output --keep_pageheader_in_output $PAGE_ARG || echo "⚠️ Marker Base timed out or failed."
            
          if [ -f conversions/issue-${{ github.event.issue.number }}/marker_base/document/document.md ]; then
            cp conversions/issue-${{ github.event.issue.number }}/marker_base/document/document.md conversions/issue-${{ github.event.issue.number }}/document_marker_${FILE_SUFFIX}.md
          fi

      # ==========================================
      # ENGINE 3: MARKER NATIVE LLM
      # ==========================================
      - name: Engine | Marker Native LLM
        if: env.ENGINE == 'marker-llm'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          LLM_MODEL="${CUSTOM_MODEL:-google/gemma-4-31b-it:free}"
          echo "Running Marker with LLM: $LLM_MODEL"
          
          timeout ${TIMEOUT_MINUTES}m marker_single document.pdf --output_dir conversions/issue-${{ github.event.issue.number }}/marker_llm \
            --mode fast $OCR_ARG --debug --keep_pagefooter_in_output --keep_pageheader_in_output \
            --use_llm --llm_service marker.services.openrouter.OpenRouterService \
            --openrouter_model "$LLM_MODEL" \
            --openrouter_api_key "${{ secrets.OPENROUTER_API_KEY }}" \
            $PAGE_ARG || echo "⚠️ Marker LLM timed out or failed."
          
          if [ -f conversions/issue-${{ github.event.issue.number }}/marker_llm/document/document.md ]; then
            cp conversions/issue-${{ github.event.issue.number }}/marker_llm/document/document.md conversions/issue-${{ github.event.issue.number }}/document_marker_llm_${FILE_SUFFIX}.md
          fi

      # ==========================================
      # PACKAGING & NOTIFICATION
      # ==========================================
      - name: Package for Obsidian
        if: always()
        run: |
          cd conversions/issue-${{ github.event.issue.number }} || exit 0
          
          find . -type f -name "*.md" -exec sed -i -e 's/\\(/$/g' -e 's/\\)/$/g' -e 's/\\\[/$$/g' -e 's/\\\]/$$/g' -e 's/\\_/_/g' -e 's/\\\*/*/g' {} + || true
          
          mkdir -p obsidian_ready
          cp document_*.md obsidian_ready/ 2>/dev/null || true
          
          find . -type f \( -iname \*.jpg -o -iname \*.jpeg -o -iname \*.png \) -not -path "*/vision/*" -not -path "*/obsidian_ready/*" -exec cp {} obsidian_ready/ \; 2>/dev/null || true
          
          zip -r obsidian_ready.zip obsidian_ready/ || true
          zip -r debug_archive.zip . -i \*/document/\* run_vision.py 2>/dev/null || true

      - name: Final Commit & Push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conversions/issue-${{ github.event.issue.number }}/ || true
          git commit -m "Generated markdown using ${ENGINE} engine for ${FILE_SUFFIX} [skip ci]" || echo "No final changes to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Post Success Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNum = context.issue.number;
            const engine = process.env.ENGINE;
            const dir = `conversions/issue-${issueNum}`;

            if (!fs.existsSync(dir)) return;

            const files = fs.readdirSync(dir)
              .filter(f => f.startsWith('document_') && f.endsWith('.md'));

            if (files.length === 0) {
              await github.rest.issues.createComment({
                issue_number: issueNum,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚠️ **Warning: No Output Generated**\n\nThe \`${engine}\` engine ran out of time or crashed before generating a valid Markdown file.`
              });
              return;
            }

            let fileLinks = files.map(f => {
              const label = f.replace('document_', '').replace('.md', '');
              return `- 📄 **${label}**: [View Markdown](https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/${dir}/${f})`;
            }).join('\n');

            await github.rest.issues.createComment({
              issue_number: issueNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Conversion Complete!**\n\n- **Engine Used:** \`${engine}\`\n- **Model:** \`${process.env.CUSTOM_MODEL || 'Default'}\`\n- **OCR Mode:** \`${process.env.OCR_ARG ? 'Forced (Neural)' : 'Standard (Fast)'}\`\n- **Footers Mode:** \`${process.env.FOOTER_MODE || 'remove'}\`\n\n### 🔬 Output Files:\n${fileLinks}\n\n📚 **Obsidian Vault:** [Download Zip](https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/${dir}/obsidian_ready.zip)`
            });
            
