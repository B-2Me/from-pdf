name: Issue PDF Converter

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: pdf-converter
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies & Download llama.cpp
        run: |
          # Added poppler-utils for pdftoppm (PDF to Image conversion) and explicit openai package
          sudo apt-get update
          sudo apt-get install -y zip unzip poppler-utils
          pip install . openai
          
          wget "https://github.com/ggml-org/llama.cpp/releases/download/b10809/llama-b10809-bin-ubuntu-x64.tar.gz" -O llama.tar.gz
          sudo mkdir -p /opt/llama_bin
          sudo tar -xzf llama.tar.gz -C /opt/llama_bin --strip-components=1
          sudo chmod +x /opt/llama_bin/llama-server
          
          echo "/opt/llama_bin" >> $GITHUB_PATH
          echo "GGML_BACKEND_PATH=/opt/llama_bin" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/llama_bin:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Extract PDF URL and Download
        run: |
          PDF_URL=$(echo "${{ github.event.issue.body }}" | grep -oP 'https://github\.com/user-attachments/(files|assets)/[^)]+\.pdf' | head -n 1)
          if [ -z "$PDF_URL" ]; then exit 1; fi
          curl -L -o document.pdf "$PDF_URL"
          
          # Convert PDF to a single image for the Vision model
          pdftoppm -png -singlefile -r 150 document.pdf page

      - name: Parse Commands
        run: |
          if echo "${{ github.event.issue.body }}" | grep -iq "/force-ocr"; then
            rm -rf conversions/issue-${{ github.event.issue.number }}
          fi
          PAGE_RANGE=$(echo "${{ github.event.issue.body }}" | grep -oP '/page-range\s+\K[\d-]+' | head -n 1)
          if [ -n "$PAGE_RANGE" ]; then
            echo "PAGE_ARG=--page_range $PAGE_RANGE" >> $GITHUB_ENV
          else
            echo "PAGE_ARG=" >> $GITHUB_ENV
          fi

      - name: Pipeline 1 | Pure Vision Model (Ling 3.0 Flash VL)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p conversions/issue-${{ github.event.issue.number }}
          cat << 'EOF' > run_vision.py
          import base64, os, sys
          from openai import OpenAI

          client = OpenAI(
              base_url="https://openrouter.ai/api/v1",
              api_key=os.environ.get("OPENROUTER_API_KEY"),
          )

          try:
              with open("page.png", "rb") as image_file:
                  b64_image = base64.b64encode(image_file.read()).decode("utf-8")
              
              prompt = """Transcribe this document page into clean Markdown. 
              Reconstruct schedules and tables using standard |---| Markdown tables with <br> for inner line breaks. 
              Do NOT use HTML tags (no <ul>, <li>, <p>). 
              Ensure every header, bullet point, footnote, and footer link at the bottom is fully captured."""

              response = client.chat.completions.create(
                  model="inclusionai/ling-3.0-flash-vl:free",
                  messages=[
                      {
                          "role": "user",
                          "content": [
                              {"type": "text", "text": prompt},
                              {"type": "image_url", "image_url": {"url": f"data:image/png;base64,{b64_image}"}}
                          ]
                      }
                  ]
              )
              
              with open(sys.argv[1], "w", encoding="utf-8") as f:
                  f.write(response.choices[0].message.content)
              print("✅ Vision model transcription saved.", flush=True)
          except Exception as e:
              print(f"❌ Vision model failed: {e}", flush=True)
          EOF
          python run_vision.py conversions/issue-${{ github.event.issue.number }}/document_vision_ling_flash.md

      - name: Pipeline 2 | Marker Base OCR (No LLM)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          marker_single document.pdf --output_dir conversions/issue-${{ github.event.issue.number }}/base \
            --mode fast --force_ocr --keep_pagefooter_in_output --keep_pageheader_in_output $PAGE_ARG
          cp conversions/issue-${{ github.event.issue.number }}/base/document/document.md conversions/issue-${{ github.event.issue.number }}/document_marker_base.md

      - name: Pipeline 3 | Marker Native LLM Correction
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
        run: |
          # Marker supports OpenAI-compatible endpoints natively, allowing us to route to OpenRouter
          marker_single document.pdf --output_dir conversions/issue-${{ github.event.issue.number }}/native_llm \
            --mode fast --force_ocr --keep_pagefooter_in_output --keep_pageheader_in_output \
            --use_llm --llm_service marker.services.openai.OpenAIService \
            --openai_model "nvidia/nemotron-3-ultra-550b-a55b:free" \
            $PAGE_ARG || echo "Marker Native LLM failed"
            
          if [ -f conversions/issue-${{ github.event.issue.number }}/native_llm/document/document.md ]; then
            cp conversions/issue-${{ github.event.issue.number }}/native_llm/document/document.md conversions/issue-${{ github.event.issue.number }}/document_marker_native_llm.md
          fi

      - name: Package for Obsidian
        run: |
          cd conversions/issue-${{ github.event.issue.number }}
          mkdir -p obsidian_ready
          cp document_*.md obsidian_ready/ 2>/dev/null || true
          find base/document/ -type f \( -iname \*.jpg -o -iname \*.jpeg -o -iname \*.png \) -exec cp {} obsidian_ready/ \; 2>/dev/null || true
          zip -r obsidian_ready.zip obsidian_ready/
          zip -r debug_archive.zip base/ native_llm/ 2>/dev/null || true

      - name: Final Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conversions/issue-${{ github.event.issue.number }}/
          git commit -m "Generate 3-way architectural bake-off for issue #${{ github.event.issue.number }} [skip ci]" || echo "No final changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Post Comparison Download Links
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNum = context.issue.number;
            const dir = `conversions/issue-${issueNum}`;

            const files = fs.readdirSync(dir)
              .filter(f => f.startsWith('document_') && f.endsWith('.md'))
              .sort();

            let fileLinks = files.map(f => {
              const label = f.replace('document_', '').replace('.md', '');
              return `- 📄 **${label}**: [View Markdown](https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/${dir}/${f})`;
            }).join('\n');

            await github.rest.issues.createComment({
              issue_number: issueNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Architectural Bake-Off Complete!**\n\n### 🔬 Output Files (Tap to Review):\n${fileLinks}\n\n📚 **Obsidian Vault (All Variants Included):** [Download Zip](https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/${dir}/obsidian_ready.zip)`
            });
