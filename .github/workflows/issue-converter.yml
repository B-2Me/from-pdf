name: Issue PDF Converter

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: pdf-converter
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies & Download llama.cpp
        run: |
          pip install .
          sudo apt-get install -y zip unzip
          
          wget "https://github.com/ggml-org/llama.cpp/releases/download/b10809/llama-b10809-bin-ubuntu-x64.tar.gz" -O llama.tar.gz
          sudo mkdir -p /opt/llama_bin
          sudo tar -xzf llama.tar.gz -C /opt/llama_bin --strip-components=1
          sudo chmod +x /opt/llama_bin/llama-server
          
          echo "/opt/llama_bin" >> $GITHUB_PATH
          echo "GGML_BACKEND_PATH=/opt/llama_bin" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/llama_bin:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Extract PDF URL and Download
        run: |
          PDF_URL=$(echo "${{ github.event.issue.body }}" | grep -oP 'https://github\.com/user-attachments/(files|assets)/[^)]+\.pdf' | head -n 1)
          if [ -z "$PDF_URL" ]; then exit 1; fi
          curl -L -o document.pdf "$PDF_URL"

      - name: Parse Commands
        run: |
          if echo "${{ github.event.issue.body }}" | grep -iq "/force-ocr"; then
            rm -rf conversions/issue-${{ github.event.issue.number }}/corrupted
            rm -rf conversions/issue-${{ github.event.issue.number }}/fixed
          fi
          PAGE_RANGE=$(echo "${{ github.event.issue.body }}" | grep -oP '/page-range\s+\K[\d-]+' | head -n 1)
          if [ -n "$PAGE_RANGE" ]; then
            echo "PAGE_ARG=--page_range $PAGE_RANGE" >> $GITHUB_ENV
          else
            echo "PAGE_ARG=" >> $GITHUB_ENV
          fi

      - name: Convert PDF (Fixed Visual OCR for Clean Spacing)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ ! -f "conversions/issue-${{ github.event.issue.number }}/fixed/document/document.md" ]; then
            mkdir -p conversions/issue-${{ github.event.issue.number }}/fixed
            marker_single document.pdf --output_dir conversions/issue-${{ github.event.issue.number }}/fixed --mode fast --force_ocr --debug $PAGE_ARG
          fi

      - name: Checkpoint Commit (Save Raw OCR Progress)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conversions/issue-${{ github.event.issue.number }}/
          git commit -m "Checkpoint: Save raw OCR results for issue #${{ github.event.issue.number }} [skip ci]" || echo "No new OCR changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Multi-Model Evaluation & Formatting
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > align_formatting.py
          import os, random, sys, time, re, collections
          from google import genai
          from openai import OpenAI

          # ==============================================================================
          # MODEL CONFIGURATION
          # To collapse back to a single model, simply remove all but one dictionary here!
          # ==============================================================================
          MODELS_TO_EVALUATE = [
              {
                  "id": "nemotron_ultra",
                  "provider": "openrouter",
                  "model": "nvidia/nemotron-3-ultra-550b-a55b:free"
              },
              {
                  "id": "nemotron_lightning",
                  "provider": "openrouter",
                  "model": "nvidia/nemotron-3.5-lightning:free"
              },
              {
                  "id": "gemini_flash",
                  "provider": "google",
                  "model": "gemini-2.5-flash-lite"
              }
          ]

          model_usage_stats = collections.defaultdict(int)

          def call_single_model(cfg, prompt):
              provider = cfg['provider']
              model_name = cfg['model']
              
              attempt, max_retries, delay = 1, 3, 5
              while attempt <= max_retries:
                  try:
                      if provider == 'google':
                          client = genai.Client(api_key=os.environ.get("GOOGLE_API_KEY"))
                          res = client.models.generate_content(model=model_name, contents=prompt).text
                      elif provider == 'openrouter':
                          client = OpenAI(base_url="https://openrouter.ai/api/v1", api_key=os.environ.get("OPENROUTER_API_KEY"))
                          res = client.chat.completions.create(
                              model=model_name,
                              messages=[{"role": "user", "content": prompt}]
                          ).choices[0].message.content
                      
                      if res:
                          model_usage_stats[f"{cfg['id']} ({model_name})"] += 1
                          return res
                  except Exception as e:
                      err_str = str(e)
                      print(f"[{cfg['id']} Attempt {attempt} Failed]: {err_str[:120]}", flush=True)
                      if any(k in err_str for k in ['403', '401', 'PERMISSION_DENIED']):
                          break
                      if any(k in err_str for k in ['429', 'RateLimit', 'RESOURCE_EXHAUSTED']):
                          time.sleep(15.0)
                      else:
                          time.sleep(delay + random.uniform(0.5, 2.0))
                          delay = min(delay * 2, 60)
                  attempt += 1
              return None

          def format_with_model(cfg, raw_text):
              print(f"\n==================================================", flush=True)
              print(f"-> Generating comparison with: {cfg['id']} ({cfg['model']})", flush=True)
              print(f"==================================================", flush=True)

              paragraphs = raw_text.split('\n\n')
              batches, current_batch = [], ""
              for p in paragraphs:
                  if not p.strip(): continue
                  if len(current_batch) + len(p) > 6000:
                      batches.append(current_batch)
                      current_batch = p
                  else:
                      current_batch += "\n\n" + p if current_batch else p
              if current_batch:
                  batches.append(current_batch)

              model_output_blocks = []

              for i, batch in enumerate(batches):
                  prompt = f"""You are a precise document reconstruction AI. Your task is to format raw OCR text into pristine Markdown.

                  CRITICAL RULES:
                  1. ZERO DATA LOSS: Every single word from the source text must exist in your output.
                  2. PREVENT ATTENTION DECAY: When finishing a table, NEVER drop the trailing non-table text (URLs, footers, notes). The last row of a table is NOT the document footer!
                  3. STRICT MARKDOWN: Absolutely NO HTML tags (no <ul>, <li>, <p>, <b>). Use standard Markdown (`-` for lists, `**` for bold). Only `<br>` is permitted inside table cells.
                  4. Convert broken math into LaTeX ($...$ or $$...$$).

                  REQUIRED OUTPUT FORMAT:
                  <scratchpad>
                  - Exact last 20 words of this text: "..."
                  - Is there text after the table? State it explicitly here so you do not omit it.
                  </scratchpad>

                  <text_block>
                  (Headings, intro paragraphs, bulleted lists preceding tables)
                  </text_block>

                  <table_block is_continuation="false">
                  (Strict Markdown table syntax: |---|)
                  </table_block>

                  <text_block>
                  (Trailing text, URLs, and footnotes following the table)
                  </text_block>

                  <source_text>
                  {batch}
                  </source_text>"""

                  res = call_single_model(cfg, prompt)
                  if not res:
                      print(f"❌ Skipping {cfg['id']} due to API failure.", flush=True)
                      return None

                  blocks = re.finditer(r'<(text_block|table_block)([^>]*)>(.*?)</\1>', res, re.DOTALL | re.IGNORECASE)
                  for match in blocks:
                      tag_name = match.group(1).lower()
                      attributes = match.group(2).lower()
                      content = match.group(3).strip()

                      if tag_name == 'text_block':
                          model_output_blocks.append(content)
                      elif tag_name == 'table_block':
                          is_continuation = 'is_continuation="true"' in attributes
                          if is_continuation and model_output_blocks and '|' in model_output_blocks[-1]:
                              lines = content.split('\n')
                              merged_rows = []
                              passed_sep = False
                              for line in lines:
                                  if re.search(r'\|[\s\-\:]+\|', line):
                                      passed_sep = True
                                      continue
                                  if passed_sep and line.strip():
                                      merged_rows.append(line)
                              model_output_blocks[-1] += "\n" + "\n".join(merged_rows)
                          else:
                              model_output_blocks.append(content)

                  time.sleep(3)

              return '\n\n'.join(model_output_blocks)

          def main(issue_num):
              base_dir = f"conversions/issue-{issue_num}"
              raw_path = f"{base_dir}/fixed/document/document.md"
              
              with open(raw_path, 'r', encoding='utf-8') as f:
                  raw_text = f.read()

              is_single_mode = len(MODELS_TO_EVALUATE) == 1

              for idx, cfg in enumerate(MODELS_TO_EVALUATE):
                  result_md = format_with_model(cfg, raw_text)
                  if not result_md: continue

                  if is_single_mode:
                      out_file = f"{base_dir}/document_aligned.md"
                  else:
                      out_file = f"{base_dir}/document_aligned_{cfg['id']}.md"
                      # Keep a primary document_aligned.md pointing to the first evaluated model
                      if idx == 0:
                          with open(f"{base_dir}/document_aligned.md", 'w', encoding='utf-8') as f:
                              f.write(result_md)

                  with open(out_file, 'w', encoding='utf-8') as f:
                      f.write(result_md)
                  print(f"Saved: {out_file}", flush=True)

              summary_path = f"{base_dir}/model_summary.md"
              with open(summary_path, 'w', encoding='utf-8') as f:
                  f.write("### 🤖 Model Usage Summary\n")
                  for m, count in model_usage_stats.items():
                      f.write(f"- **{m}**: {count} successful calls\n")

          if __name__ == "__main__":
              main(sys.argv[1])
          EOF
          
          python align_formatting.py ${{ github.event.issue.number }}

      - name: Package for Obsidian
        run: |
          cd conversions/issue-${{ github.event.issue.number }}
          mkdir -p obsidian_ready
          cp document_aligned*.md obsidian_ready/
          find fixed/document/ -type f \( -iname \*.jpg -o -iname \*.jpeg -o -iname \*.png \) -exec cp {} obsidian_ready/ \;
          zip -r obsidian_ready.zip obsidian_ready/
          zip -r debug_archive.zip fixed/ ../../align_formatting.py

      - name: Final Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conversions/issue-${{ github.event.issue.number }}/
          git commit -m "Generate multi-model comparisons for issue #${{ github.event.issue.number }} [skip ci]" || echo "No final changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Post Comparison Download Links
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNum = context.issue.number;
            const dir = `conversions/issue-${issueNum}`;
            
            let modelSummary = fs.existsSync(`${dir}/model_summary.md`) 
              ? fs.readFileSync(`${dir}/model_summary.md`, 'utf8') 
              : "_Model tracking information unavailable._";

            const files = fs.readdirSync(dir)
              .filter(f => f.startsWith('document_aligned') && f.endsWith('.md'))
              .sort();

            let fileLinks = files.map(f => {
              const label = f.replace('document_aligned_', '').replace('.md', '').replace('document_aligned', 'primary_output');
              return `- 📄 **${label}**: [View Markdown](https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/${dir}/${f})`;
            }).join('\n');

            await github.rest.issues.createComment({
              issue_number: issueNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Comparison Complete!**\n\n${modelSummary}\n\n### 🔬 Output Files (Tap to Review):\n${fileLinks}\n\n📚 **Obsidian Vault (All Variants Included):** [Download Zip](https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/${dir}/obsidian_ready.zip)`
            });
