name: Issue PDF Converter

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: pdf-converter
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip poppler-utils
          pip install . openai
          
          wget "https://github.com/ggml-org/llama.cpp/releases/download/b10809/llama-b10809-bin-ubuntu-x64.tar.gz" -O llama.tar.gz
          sudo mkdir -p /opt/llama_bin
          sudo tar -xzf llama.tar.gz -C /opt/llama_bin --strip-components=1
          sudo chmod +x /opt/llama_bin/llama-server
          
          echo "/opt/llama_bin" >> $GITHUB_PATH
          echo "GGML_BACKEND_PATH=/opt/llama_bin" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/llama_bin:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Extract PDF URL and Download
        run: |
          PDF_URL=$(echo "${{ github.event.issue.body }}" | grep -oP 'https://github\.com/user-attachments/(files|assets)/[^)]+\.pdf' | head -n 1)
          if [ -z "$PDF_URL" ]; then exit 1; fi
          curl -L -o document.pdf "$PDF_URL"

      - name: Parse Slash Commands
        run: |
          # 1. Engine Routing
          ENGINE="marker"
          if echo "${{ github.event.issue.body }}" | grep -iq "/engine=vision"; then ENGINE="vision"; fi
          if echo "${{ github.event.issue.body }}" | grep -iq "/engine=marker-llm"; then ENGINE="marker-llm"; fi
          echo "ENGINE=$ENGINE" >> $GITHUB_ENV
          echo "-> Engine: $ENGINE"

          # 2. OCR Mode Override
          if echo "${{ github.event.issue.body }}" | grep -iq "/force-ocr"; then
            echo "OCR_ARG=--force_ocr" >> $GITHUB_ENV
            echo "-> OCR: Forced (Neural Vision OCR)"
          else
            echo "OCR_ARG=" >> $GITHUB_ENV
            echo "-> OCR: Standard (Fast Native Layer)"
          fi

          # 3. Page Range & File Suffix
          PAGE_RANGE=$(echo "${{ github.event.issue.body }}" | grep -oP '/page-range(?:=|\s+)\K[\d-]+' | head -n 1)
          if [ -n "$PAGE_RANGE" ]; then
            echo "PAGE_ARG=--page_range $PAGE_RANGE" >> $GITHUB_ENV
            echo "FILE_SUFFIX=pages_$PAGE_RANGE" >> $GITHUB_ENV
            echo "-> Page Range: $PAGE_RANGE"
            
            FIRST_PAGE=$(echo$PAGE_RANGE | cut -d'-' -f1)
            LAST_PAGE=$(echo$PAGE_RANGE | cut -d'-' -f2)
            echo "PDFTOPPM_ARGS=-f $FIRST_PAGE -l $LAST_PAGE" >> $GITHUB_ENV
          else
            echo "PAGE_ARG=" >> $GITHUB_ENV
            echo "FILE_SUFFIX=full_document" >> $GITHUB_ENV
            echo "PDFTOPPM_ARGS=" >> $GITHUB_ENV
          fi

          # 4. Timeout Override
          TIMEOUT_MINS=$(echo "${{ github.event.issue.body }}" | grep -oP '/timeout(?:=|\s+)\K\d+' | head -n 1)
          if [ -z "$TIMEOUT_MINS" ]; then TIMEOUT_MINS="15"; fi
          echo "TIMEOUT_MINUTES=$TIMEOUT_MINS" >> $GITHUB_ENV
          echo "-> Timeout: ${TIMEOUT_MINS}m"

          # 5. Model Override
          CUSTOM_MODEL=$(echo "${{ github.event.issue.body }}" | grep -oP '/model(?:=|\s+)\K[^\s]+' | head -n 1)
          echo "CUSTOM_MODEL=$CUSTOM_MODEL" >> $GITHUB_ENV
          if [ -n "$CUSTOM_MODEL" ]; then echo "-> Model Override: $CUSTOM_MODEL"; fi

      # ==========================================
      # ENGINE 1: PURE VISION
      # ==========================================
      - name: Engine | Vision Pipeline
        if: env.ENGINE == 'vision'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p conversions/issue-${{ github.event.issue.number }}/vision
          pdftoppm -png -r 150 $PDFTOPPM_ARGS document.pdf conversions/issue-${{ github.event.issue.number }}/vision/page || echo "⚠️ pdftoppm image extraction completed with warnings."
          mv page-*.png conversions/issue-${{ github.event.issue.number }}/vision/ 2>/dev/null || true
          
          cat << 'EOF' > run_vision.py
          import base64, os, sys, glob, re, time
          from openai import OpenAI

          client = OpenAI(
              base_url="https://openrouter.ai/api/v1",
              api_key=os.environ.get("OPENROUTER_API_KEY"),
          )

          model_to_use = os.environ.get("CUSTOM_MODEL") or "inclusionai/ling-3.0-flash-vl:free"
          file_suffix = os.environ.get("FILE_SUFFIX")

          def get_page_num(filename):
              m = re.search(r'page.*?(\d+)\.png$', filename)
              return int(m.group(1)) if m else 0

          image_files = sorted(glob.glob(f"{sys.argv[1]}/vision/page-*.png"), key=get_page_num)
          out_file = f"{sys.argv[1]}/document_vision_{file_suffix}.md"

          with open(out_file, "w", encoding="utf-8") as f:
              f.write("")

          print(f"-> Found {len(image_files)} pages. Processing with {model_to_use}...", flush=True)

          for img_path in image_files:
              print(f"   Transcribing {os.path.basename(img_path)}...", flush=True)
              with open(img_path, "rb") as f:
                  b64_image = base64.b64encode(f.read()).decode("utf-8")
              
              prompt = """Transcribe this document page into clean Markdown. 

              CRITICAL MATH RULES:
              1. ALWAYS format mathematical equations, symbols, and standalone variables using proper LaTeX enclosed in `$` for inline math and `$$` for block math.
              2. NEVER use Unicode math characters (e.g., avoid 𝓕, ℒ, Σ). Use their LaTeX equivalents instead (e.g., $\mathcal{F}$, $\mathcal{L}$, $\Sigma$).
              3. DO NOT escape underscores. Write `_` instead of `\_` both inside and outside of math blocks.

              FORMATTING RULES:
              - Reconstruct schedules and tables using standard |---| Markdown tables with <br> for inner line breaks. 
              - Do NOT use HTML tags (no <ul>, <li>, <p>). 
              - Ensure every header, bullet point, footnote, and footer link at the bottom is fully captured."""

              attempt = 1
              while attempt <= 3:
                  try:
                      response = client.chat.completions.create(
                          model=model_to_use,
                          messages=[
                              {
                                  "role": "user",
                                  "content": [
                                      {"type": "text", "text": prompt},
                                      {"type": "image_url", "image_url": {"url": f"data:image/png;base64,{b64_image}"}}
                                  ]
                              }
                          ]
                      )
                      with open(out_file, "a", encoding="utf-8") as f:
                          f.write(response.choices[0].message.content + "\n\n---\n\n")
                      break
                  except Exception as e:
                      print(f"     ❌ Attempt {attempt} failed: {e}", flush=True)
                      time.sleep(5)
                      attempt += 1
              time.sleep(2)

          print(f"✅ Vision transcription completed.", flush=True)
          EOF
          
          timeout ${TIMEOUT_MINUTES}m python run_vision.py conversions/issue-${{ github.event.issue.number }} || echo "⚠️ Vision script timed out, partial file saved."

      # ==========================================
      # ENGINE 2: MARKER CPU (DEFAULT FAST)
      # ==========================================
      - name: Engine | Marker Base
        if: env.ENGINE == 'marker'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          timeout ${TIMEOUT_MINUTES}m marker_single document.pdf --output_dir conversions/issue-${{ github.event.issue.number }}/marker_base \
            --mode fast $OCR_ARG --keep_pagefooter_in_output --keep_pageheader_in_output$PAGE_ARG || echo "⚠️ Marker Base timed out or failed."
            
          if [ -f conversions/issue-${{ github.event.issue.number }}/marker_base/document/document.md ]; then
            cp conversions/issue-${{ github.event.issue.number }}/marker_base/document/document.md conversions/issue-${{ github.event.issue.number }}/document_marker_${FILE_SUFFIX}.md
          fi

      # ==========================================
      # ENGINE 3: MARKER NATIVE LLM
      # ==========================================
      - name: Engine | Marker Native LLM
        if: env.ENGINE == 'marker-llm'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MARKER_OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MARKER_OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
        run: |
          LLM_MODEL="${CUSTOM_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}"
          echo "Running Marker with LLM: $LLM_MODEL"
          
          timeout ${TIMEOUT_MINUTES}m marker_single document.pdf --output_dir conversions/issue-${{ github.event.issue.number }}/marker_llm \
            --mode fast $OCR_ARG --keep_pagefooter_in_output --keep_pageheader_in_output \
            --use_llm --llm_service marker.services.openai.OpenAIService \
            --openai_model "$LLM_MODEL" \
            $PAGE_ARG || echo "⚠️ Marker LLM timed out or failed."
          
          if [ -f conversions/issue-${{ github.event.issue.number }}/marker_llm/document/document.md ]; then
            cp conversions/issue-${{ github.event.issue.number }}/marker_llm/document/document.md conversions/issue-${{ github.event.issue.number }}/document_marker_llm_${FILE_SUFFIX}.md
          fi

      # ==========================================
      # PACKAGING & NOTIFICATION
      # ==========================================
      - name: Package for Obsidian
        if: always()
        run: |
          cd conversions/issue-${{ github.event.issue.number }} || exit 0
          
          # Clean up rogue escaped underscores across ALL generated Markdown files
          find . -type f -name "*.md" -exec sed -i 's/\\_/_/g' {} +
          
          mkdir -p obsidian_ready
          cp document_*.md obsidian_ready/ 2>/dev/null || true
          
          find . -type f \( -iname \*.jpg -o -iname \*.jpeg -o -iname \*.png \) -not -path "*/vision/*" -not -path "*/obsidian_ready/*" -exec cp {} obsidian_ready/ \; 2>/dev/null || true
          
          zip -r obsidian_ready.zip obsidian_ready/ || true
          zip -r debug_archive.zip . -i \*/document/\* run_vision.py 2>/dev/null || true

      - name: Final Commit & Push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conversions/issue-${{ github.event.issue.number }}/ || true
          git commit -m "Generated markdown using ${ENGINE} engine for${FILE_SUFFIX} [skip ci]" || echo "No final changes to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Post Success Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNum = context.issue.number;
            const engine = process.env.ENGINE;
            const dir = `conversions/issue-${issueNum}`;

            if (!fs.existsSync(dir)) return;

            const files = fs.readdirSync(dir)
              .filter(f => f.startsWith('document_') && f.endsWith('.md'));

            if (files.length === 0) {
              await github.rest.issues.createComment({
                issue_number: issueNum,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚠️ **Warning: No Output Generated**\n\nThe \`${engine}\` engine ran out of time or crashed before generating a valid Markdown file.`
              });
              return;
            }

            let fileLinks = files.map(f => {
              const label = f.replace('document_', '').replace('.md', '');
              return `- 📄 **${label}**: [View Markdown](https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/${dir}/${f})`;
            }).join('\n');

            await github.rest.issues.createComment({
              issue_number: issueNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Conversion Complete!**\n\n- **Engine Used:** \`${engine}\`\n- **Model:** \`${process.env.CUSTOM_MODEL || 'Default'}\`\n- **OCR Mode:** \`${process.env.OCR_ARG ? 'Forced (Neural)' : 'Standard (Fast)'}\`\n\n### 🔬 Output Files (Chunks Safely Accumulated):\n${fileLinks}\n\n📚 **Obsidian Vault:** [Download Zip](https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/${dir}/obsidian_ready.zip)`
            });
